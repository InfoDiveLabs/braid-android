name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restore the signing key
        env:
          BRAID_KEYSTORE_BASE64: ${{ secrets.BRAID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$BRAID_KEYSTORE_BASE64" | base64 --decode > keystore/braid-release.jks

      - name: Test
        run: ./gradlew :relay:test

      - name: Build the signed APK
        env:
          BRAID_KEYSTORE: keystore/braid-release.jks
          BRAID_KEYSTORE_PASSWORD: ${{ secrets.BRAID_KEYSTORE_PASSWORD }}
          BRAID_KEY_ALIAS: ${{ secrets.BRAID_KEY_ALIAS }}
          BRAID_KEY_PASSWORD: ${{ secrets.BRAID_KEY_PASSWORD }}
        run: ./gradlew :app:dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            One APK for every Android phone (arm64-v8a, armeabi-v7a, x86_64, x86): the app has no native code.
            Requires Android 8.0 or later. See the README for which device uses which architecture.
